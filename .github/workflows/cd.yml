name: CD

on:
  push:
    # Trigger only on version tags: v1.0.0, v0.3.1, etc.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BINARY_NAME: arc

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (musl = fully static, no glibc version dependency)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz

          # ── Linux ARM64 (e.g. AWS Graviton, Raspberry Pi 4+)
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz

          # ── Linux ARMv7 (e.g. Raspberry Pi 2/3)
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            archive: tar.gz

          # ── macOS Intel
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          # ── macOS Apple Silicon
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          # ── Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # houseabsolute/actions-rust-cross handles cross-compilation transparently:
      # uses `cross` (Docker-based) for Linux ARM targets, native `cargo` for
      # x86 Linux, macOS, and Windows where the host toolchain suffices.
      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set binary filename (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ARCHIVE="${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Set binary filename (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin  = "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe"
          $zip  = "${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $zip
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ env.VERSION }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 1

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "arc ${{ env.VERSION }}"
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*
